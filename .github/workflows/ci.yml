name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # shared/ is the ShowTrak-Protocol submodule; without it the
          # @showtrak/protocol path mapping resolves to an empty directory.
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `usb` builds a native addon via node-gyp; libudev is its Linux header dep.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # pretest runs the full build, so this also covers `npm run build`.
      - name: Test
        run: npm test

      # Reported, never enforced. There is deliberately no coverage threshold
      # here — the number is published so a drop is visible in the PR, not used
      # as a gate, so `continue-on-error` keeps a c8 hiccup from failing a run
      # whose tests already passed above.
      #
      # --ignore-scripts skips pretest:coverage, which would otherwise `clean`
      # and rebuild everything a second time; the Test step above already built
      # dist/ and dist-test/ in this same job.
      - name: Coverage (reported, non-gating)
        run: npm run test:coverage --ignore-scripts
        continue-on-error: true
